<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTHELEM CONFORT PITCH BLOSSOM</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
    color: #ffffff;
    background:
    linear-gradient(rgba(12,55,25,.35),rgba(12,55,25,.55)),
    linear-gradient(135deg,#173d20,#507b35,#a4bd70);
}

.garden {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.flower {
    position: absolute;
    font-size: 35px;
    animation: float 9s infinite ease-in-out;
    opacity: .85;
}

@keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-35px) rotate(15deg); }
}

.petal {
    position: absolute;
    top: -40px;
    font-size: 20px;
    animation: fall linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

.container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    position: relative;
    z-index: 2;
}

.welcome {
    width: 100%;
    max-width: 500px;
    text-align: center;
    padding: 40px 25px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 30px;
    background: rgba(255,255,255,.13);
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 50px rgba(0,0,0,.2);
}

.logo {
    font-size: 55px;
    margin-bottom: 20px;
}

h1 {
    font-size: 29px;
    line-height: 1.4;
    letter-spacing: 2px;
    color: #fff;
}

.subtitle {
    margin-top: 18px;
    font-size: 17px;
    line-height: 1.8;
    color: #f4ffe9;
}

.divider {
    margin: 25px auto;
    width: 100px;
    height: 2px;
    background: #f6df75;
}

.enter {
    display: inline-block;
    margin-top: 25px;
    padding: 16px 32px;
    border-radius: 40px;
    border: none;
    background: #f4df78;
    color: #254a24;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
}

.enter:active {
    transform: scale(.95);
}

.footer {
    margin-top: 30px;
    font-size: 13px;
    color: #e8f3dc;
}

@media(max-width:400px) {
    h1 { font-size: 23px; }
    .welcome { padding: 35px 18px; }
}
</style>
</head>

<body>

<div class="garden" id="garden"></div>

<div class="container">
    <div class="welcome">

        <div class="logo">🌼</div>

        <h1>
        ANTHELEM CONFORT<br>
        PITCH BLOSSOM
        </h1>

        <div class="divider"></div>

        <p class="subtitle">
        Somewhere in this endless world of flowers,
        two people found a beautiful place to talk.
        </p>

        <button class="enter" onclick="enterWorld()">
        🌻 ENTER OUR WORLD
        </button>

        <div class="footer">
        A little world of flowers, conversations and memories.
        </div>

    </div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const garden = document.getElementById("garden");

const flowers = ["🌼","🌻","🌸","🌿","💮"];

for(let i=0;i<35;i++){
    const flower = document.createElement("div");
    flower.className = "flower";
    flower.textContent = flowers[Math.floor(Math.random()*flowers.length)];
    flower.style.left = Math.random()*100+"%";
    flower.style.top = Math.random()*100+"%";
    flower.style.animationDelay = Math.random()*8+"s";
    garden.appendChild(flower);
}

for(let i=0;i<20;i++){
    const petal = document.createElement("div");
    petal.className = "petal";
    petal.textContent = "🌼";
    petal.style.left = Math.random()*100+"%";
    petal.style.animationDuration = (6+Math.random()*10)+"s";
    petal.style.animationDelay = Math.random()*10+"s";
    garden.appendChild(petal);
}

function enterWorld(){
    alert("Welcome to our little flower world! 🌼");
}

const firebaseConfig = {
    apiKey: "AIzaSyAfUdswmVWWffxejmACuHD1_6o9GZBtTcs",,
    authDomain: "anthelem-blossom.firebaseapp.com",
    projectId: "anthelem-blossom",
    storageBucket: "anthelem-blossom.firebasestorage.app",
    messagingSenderId: "687614752920",
    appId: "1:687614752920:web:8d14a77366980d0bd338ed",
    measurementId: "G-LRNLMJNGZM"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

console.log("ANTHELEM BLOSSOM Firebase connected!");

</script>

</body>
</html>
